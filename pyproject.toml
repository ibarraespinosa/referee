[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "referee-pdf"
version = "1.0.0"
description = "Acrobat-like PDF Annotation & Review Editor for Ubuntu/Linux"
readme = "README.md"
authors = [
  { name="Sergio Ibarra-Espinosa", email="zergioibarra@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "PyQt5>=5.15.0",
    "pymupdf>=1.24.0",
]
requires-python = ">=3.8"

[project.scripts]
referee = "referee.app:main"
pdf-reviewer = "referee.app:main"

[project.urls]
Homepage = "https://github.com/ibarraespinosa/referee"
"Bug Tracker" = "https://github.com/ibarraespinosa/referee/issues"
